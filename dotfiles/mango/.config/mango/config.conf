# ── AUTOSTART ───────────────────────────────────────────────
exec_once=noctalia --daemon
exec_once=alacritty --daemon

# ── NOCTALIA THEME ─────────────────────────────────────────
source_optional=~/.config/mango/noctalia.conf

# ── CURSOR ─────────────────────────────────────────────────
env=XCURSOR_SIZE,24
cursor_theme=Adwaita
cursor_size=24

# ── INPUT ───────────────────────────────────────────────────
xkb_rules_layout=us

device_rule=name:SynPS/2 Synaptics TouchPad,send_events_mode:1

# ── GENERAL ────────────────────────────────────────────────
border_px=3
gap_inner_horizontal=3
gap_inner_vertical=3
gap_outer_horizontal=6
gap_outer_vertical=6

# ── DECORATION ─────────────────────────────────────────────
border_radius=0
blur=0

# ── LAYOUT (DWINDLE) ────────────────────────────────────────
dwindle_preserve_split=1

tag_rule=id:1,layout_name:dwindle
tag_rule=id:2,layout_name:dwindle
tag_rule=id:3,layout_name:dwindle
tag_rule=id:4,layout_name:dwindle
tag_rule=id:5,layout_name:dwindle
tag_rule=id:6,layout_name:dwindle
tag_rule=id:7,layout_name:dwindle
tag_rule=id:8,layout_name:dwindle
tag_rule=id:9,layout_name:dwindle

# ── SPECIAL WORKSPACE (TAG 0) ───────────────────────────────
special_dim=0.35
tag_rule=id:0,layout_name:scroller,scroller_default_proportion:0.8

scroller_default_proportion_single=0.8

scroller_focus_center=1
scroller_prefer_center=0
scroller_prefer_overspread=0

# More breathing room around scratchpad windows
special_gap_inner_horizontal=8
special_gap_inner_vertical=8
special_gap_outer_horizontal=48
special_gap_outer_vertical=48

# ── ANIMATIONS ─────────────────────────────────────────────
animations=1
layer_animations=0

animation_type_open=slide
animation_type_close=fade

animation_fade_in=1
animation_fade_out=1

animation_duration_open=180
animation_duration_close=140
animation_duration_move=180
animation_duration_tag=220
animation_duration_focus=120

animation_curve_open=0.16,1.0,0.3,1.0
animation_curve_close=0.16,1.0,0.3,1.0
animation_curve_move=0.16,1.0,0.3,1.0
animation_curve_tag=0.16,1.0,0.3,1.0
animation_curve_focus=0.16,1.0,0.3,1.0

# ── KEYBINDS: MEDIA ────────────────────────────────────────
bindl=NONE,XF86AudioRaiseVolume,spawn,noctalia msg volume-up
bindl=NONE,XF86AudioLowerVolume,spawn,noctalia msg volume-down
bind=NONE,XF86AudioMute,spawn,noctalia msg volume-mute
bind=NONE,XF86AudioMicMute,spawn,noctalia msg mic-mute
bindl=NONE,XF86MonBrightnessUp,spawn,noctalia msg brightness-up
bindl=NONE,XF86MonBrightnessDown,spawn,noctalia msg brightness-down

# ── KEYBINDS: SCREENSHOTS ──────────────────────────────────
bind=NONE,Print,spawn,noctalia msg screenshot-fullscreen
bind=SUPER,Print,spawn,noctalia msg screenshot-region

# ── KEYBINDS: LAUNCH ───────────────────────────────────────
bind=SUPER,Return,spawn,alacritty msg create-window
bind=SUPER,space,spawn,noctalia msg panel-toggle launcher
bind=SUPER,F,spawn,thunar
bind=SUPER+SHIFT,Escape,spawn,noctalia msg session lock
bind=SUPER,W,spawn,noctalia msg panel-toggle wallpaper
bind=SUPER,V,spawn,noctalia msg panel-toggle clipboard
bind=SUPER,N,spawn,noctalia msg panel-toggle control-center notifications

# ── KEYBINDS: SCRATCHPAD ────────────────────────────────────
bind=SUPER,S,toggle_special_tag
bind=SUPER+SHIFT,S,tag_special_tag

# ── KEYBINDS: SESSION ───────────────────────────────────────
bind=SUPER+SHIFT,R,reload_config

# ── KEYBINDS: WINDOWS ───────────────────────────────────────
bind=SUPER,Q,killclient
bind=SUPER+SHIFT,F,togglefullscreen

# ── FOCUS ──────────────────────────────────────────────────
bind=SUPER,H,focusdir,left
bind=SUPER,L,focusdir,right
bind=SUPER,K,focusdir,up
bind=SUPER,J,focusdir,down

# ── MOVE WINDOWS ───────────────────────────────────────────
bind=SUPER+SHIFT,H,move_client,left
bind=SUPER+SHIFT,L,move_client,right
bind=SUPER+SHIFT,K,move_client,up
bind=SUPER+SHIFT,J,move_client,down

# ── TAGS / WORKSPACES ──────────────────────────────────────
bind=SUPER,1,view,1
bind=SUPER,2,view,2
bind=SUPER,3,view,3
bind=SUPER,4,view,4
bind=SUPER,5,view,5
bind=SUPER,6,view,6
bind=SUPER,7,view,7
bind=SUPER,8,view,8
bind=SUPER,9,view,9

bind=SUPER+SHIFT,1,tag,1
bind=SUPER+SHIFT,2,tag,2
bind=SUPER+SHIFT,3,tag,3
bind=SUPER+SHIFT,4,tag,4
bind=SUPER+SHIFT,5,tag,5
bind=SUPER+SHIFT,6,tag,6
bind=SUPER+SHIFT,7,tag,7
bind=SUPER+SHIFT,8,tag,8
bind=SUPER+SHIFT,9,tag,9

# ── WINDOW RULES ───────────────────────────────────────────
window_rule=is_floating:1,offset_x:0,offset_y:0,title:Open File|Save File|Select.*File

window_rule=is_floating:1,width:900,height:600,offset_x:0,offset_y:0,title:bluetu[iI]

window_rule=is_fullscreen:1,title:nmtui
