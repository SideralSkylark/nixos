config_version = 8

[bar.default]
center = [ "clock", "media" ]
end = [ "network", "bluetooth", "battery", "control-center", "session" ]
font_family = "JetBrainsMono Nerd Font"
margin_ends = 0
radius = 0
shadow = false
start = [ "workspaces" ]
widget_spacing = 14

[desktop_widgets]
enabled = false
schema_version = 2
widget_order = [ "desktop-widget-0000000000000001" ]

    [desktop_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [desktop_widgets.widget.desktop-widget-0000000000000001]
    box_height = 144.0
    box_width = 240.0
    cx = 998.0
    cy = 520.5
    output = "eDP-1"
    rotation = 0.0
    type = "clock"

[idle]
behavior_order = [ "lock", "screen-off", "lock-and-suspend" ]

    [idle.behavior.lock]
    action = "lock"
    enabled = true
    timeout = 600.0

    [idle.behavior.lock-and-suspend]
    action = "lock_and_suspend"
    enabled = true
    timeout = 900.0

    [idle.behavior.screen-off]
    action = "screen_off"
    enabled = true
    timeout = 660.0

[location]
address = "Maputo, Mozambique"

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@eDP-1" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@eDP-1"]
    box_height = 229.0
    box_width = 810.0
    cx = 960.0
    cy = 881.5
    output = "eDP-1"
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@eDP-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_weather = true

[shell]
clipboard_history_max_entries = 20
corner_radius_scale = 0.0
font_family = "Noto Sans"
polkit_agent = true
popup_shadows = false

    [shell.animation]
    enabled = false

    [shell.launcher]
    categories = false
    sort_by_usage = false

    [shell.shadow]
    alpha = 0.0

[theme]
builtin = "Rosé Pine"
community_palette = "Everforest"
source = "community"
wallpaper_scheme = "m3-content"

    [theme.templates]
    builtin_ids = [ "foot", "gtk3", "gtk4", "ghostty", "hyprland", "qt", "starship" ]

[wallpaper]
directory = "/home/skylark/Pictures/Wallpapers"
transition = [ "fade" ]

    [wallpaper.default]
    path = "/home/skylark/Pictures/Wallpapers/fuji.jpg"

    [wallpaper.last]
    path = "/home/skylark/Pictures/Wallpapers/fuji.jpg"

    [wallpaper.monitors.eDP-1]
    path = "/home/skylark/Pictures/Wallpapers/fuji.jpg"

[weather]
effects = false

[widget.bluetooth]
hide_when_no_connected_device = true

[widget.clock]
anchor = true
format = "{:%H:%M:%S}"
scale = 1.1500000000000001

[widget.media]
hide_when_no_media = true

[widget.workspaces]
anchor = true
scale = 1.1500000000000001
style = "minimal"