[bar.default]
center = [ "clock", "media" ]
end = [ "network", "bluetooth", "battery", "control-center", "session" ]
font_family = "JetBrainsMono Nerd Font"
margin_ends = 0
radius = 0
shadow = false
start = [ "workspaces" ]
widget_spacing = 14

[battery]
warning_threshold = 15

[control_center]
show_session_button = false

[desktop_widgets]
enabled = false
schema_version = 2
widget_order = [ "desktop-widget-0000000000000001" ]

    [desktop_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [desktop_widgets.widget.desktop-widget-0000000000000001]
    box_height = 144.0
    box_width = 240.0
    cx = 998.0
    cy = 520.5
    output = "eDP-1"
    placement_height = 1080.0
    placement_width = 1920.0
    rotation = 0.0
    type = "clock"

[hot_corners.top_left]
action = "launcher"

[idle]
behavior_order = [ "lock", "screen-off", "lock-and-suspend" ]

    [idle.behavior.lock]
    action = "lock"
    enabled = true
    timeout = 600.0

    [idle.behavior.lock-and-suspend]
    action = "lock_and_suspend"
    enabled = true
    timeout = 900.0

    [idle.behavior.screen-off]
    action = "screen_off"
    enabled = true
    timeout = 660.0

[location]
address = "Maputo, Mozambique"

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@HDMI-A-1", "lockscreen-login-box@eDP-1" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 640.0
    cy = 601.5
    output = "HDMI-A-1"
    placement_height = 0.0
    placement_width = 0.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-1".settings]
        background_color = "surface_container"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

    [lockscreen_widgets.widget."lockscreen-login-box@eDP-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 960.0
    cy = 881.5
    output = "eDP-1"
    placement_height = 1080.0
    placement_width = 1920.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@eDP-1".settings]
        background_color = "surface_container"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

[shell]
clipboard_history_max_entries = 20
corner_radius_scale = 0.0
font_family = "Noto Sans"
polkit_agent = true
popup_shadows = false
settings_show_advanced = false

    [shell.animation]
    enabled = false

    [shell.launcher]
    categories = false
    layout = "simple"
    sort_by_usage = false

        [shell.launcher.providers.calculator]
        prefix = ""

        [shell.launcher.providers.session]
        global = false

    [shell.panel]
    borders = false
    control_center_position = "top_right"
    polkit_position = "center_left"
    shadow = false

    [shell.screenshot]
    directory = "/home/skylark/Pictures/screenshots"

    [shell.shadow]
    alpha = 0.0

[system.monitor]
enabled = false

[theme]
builtin = "Gruvbox"
community_palette = "Everforest"
mode = "auto"
source = "builtin"
wallpaper_scheme = "m3-rainbow"

    [theme.templates]
    builtin_ids = [ "alacritty", "gtk3", "gtk4", "hyprland", "qt" ]

[wallpaper]
directory = "/home/skylark/Pictures/Wallpapers"
transition = [ "fade" ]

    [wallpaper.default]
    path = "/home/skylark/Pictures/Wallpapers/pixel-prairie.jpg"

    [wallpaper.last]
    path = "/home/skylark/Pictures/Wallpapers/pixel-prairie.jpg"

    [wallpaper.monitors.eDP-1]
    path = "/home/skylark/Pictures/Wallpapers/pixel-prairie.jpg"

[weather]
effects = false
refresh_minutes = 240

[widget.bluetooth]
hide_when_no_connected_device = true

[widget.clock]
anchor = true
format = "{:%H:%M:%S}"
scale = 1.1500000000000001

[widget.control-center]
glyph = "chevron-down"

[widget.media]
art_size = 22
hide_when_no_media = true

[widget.network]
scale = 0.94999999999999996

[widget.workspaces]
anchor = true
scale = 1.1500000000000001
separator = ""
style = "minimal"
